# Hot-deal crawler on GitHub Actions (free alternative to the Blaze-only Cloud Function).
#
# Each run crawls every 2 minutes for ~25 minutes, then starts the next run itself
# (workflow_dispatch with the job's token), so crawling continues without relying on
# GitHub's schedule, which had not fired at all for this repository.
# The schedule stays as a backup that restarts the chain if it ever breaks.
# The chain stops after a failed run, or when the repository variable CRAWL_CHAIN is "off".
#
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT (service account key JSON).
# Note: GitHub pauses scheduled workflows after 60 days without repository activity.
name: crawl

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep crawling (minutes)"
        default: "25"

# One run at a time; a newly started run waits for the current one.
concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # to start the next run

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Crawl
        run: node lib/run.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RUN_FOR_MINUTES: ${{ github.event.inputs.minutes || '25' }}
          INTERVAL_SECONDS: "120"
      - name: Start the next run
        if: success() && vars.CRAWL_CHAIN != 'off'
        run: gh workflow run crawl.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f minutes=25
        env:
          GH_TOKEN: ${{ github.token }}
