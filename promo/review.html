<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>오픈런 솔직 리뷰 쇼츠</title>
<style>
  @font-face { font-family: SCD; src: url('../assets/font/SCDream5.otf'); font-weight: 500; }
  @font-face { font-family: SCD; src: url('../assets/font/SCDream7.otf'); font-weight: 700; }
  @font-face { font-family: SCD; src: url('../assets/font/SCDream9.otf'); font-weight: 900; }
  @font-face { font-family: Noto; src: url('../assets/font/NotoSansCJKkr-Regular.otf'); font-weight: 400; }
  @font-face { font-family: Noto; src: url('../assets/font/NotoSansCJKkr-Medium.otf'); font-weight: 500; }
  @font-face { font-family: Noto; src: url('../assets/font/NotoSansCJKkr-Bold.otf'); font-weight: 700; }
  @font-face { font-family: Noto; src: url('../assets/font/NotoSansCJKkr-Black.otf'); font-weight: 900; }

  :root { --pink: #F90069; --pink-soft: #FFE6F0; --ink: #1d1d1f; --sub: #8a8a8e; --bg: #F5F5F7; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: SCD, Noto, sans-serif;
           background: radial-gradient(1200px 900px at 50% 30%, #ff2d86 0%, #F90069 55%, #d1005a 100%); }
  .layer { position: absolute; inset: 0; }

  /* ---------- persistent review chrome ---------- */
  #adTag { position: absolute; left: 40px; top: 60px; z-index: 50; background: rgba(0,0,0,.35); color: #fff; font: 500 26px Noto; padding: 8px 18px; border-radius: 12px; }
  #header { position: absolute; left: 0; right: 0; top: 130px; text-align: center; color: #fff; z-index: 40; }
  #header .t { font: 900 84px SCD; letter-spacing: -3px; }
  #header .t span { background: #fff; color: var(--pink); padding: 0 16px; border-radius: 16px; }
  #steps { margin-top: 26px; display: flex; justify-content: center; gap: 16px; }
  .step { font: 700 34px Noto; color: rgba(255,255,255,.55); border: 3px solid rgba(255,255,255,.45); border-radius: 40px; padding: 8px 26px; }
  .step.on { background: #fff; color: var(--pink); border-color: #fff; }
  .step.con.on { background: #111; color: #fff; border-color: #111; }

  #point { position: absolute; left: 0; right: 0; top: 380px; text-align: center; z-index: 41; color: #fff; }
  #point .p { display: inline-block; font: 900 64px SCD; letter-spacing: -2px; background: rgba(0,0,0,.28); padding: 10px 34px; border-radius: 22px; }

  /* subtitles */
  #sub { position: absolute; left: 40px; right: 40px; top: 1300px; z-index: 60; text-align: center; }
  #sub span { display: inline; background: rgba(0,0,0,.78); color: #fff; font: 700 54px Noto; line-height: 1.55; padding: 6px 18px;
              border-radius: 14px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  #sub b { color: #ffd84d; font-weight: 900; }

  /* ---------- intro ---------- */
  #intro { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 330px; color: #fff; text-align: center; }
  #intro .maker { font: 700 52px SCD; background: rgba(0,0,0,.25); padding: 12px 34px; border-radius: 40px; }
  #intro .big { margin-top: 40px; font: 900 132px SCD; letter-spacing: -5px; line-height: 1.15; }
  #intro .big em { font-style: normal; background: #fff; color: var(--pink); padding: 0 20px; border-radius: 20px; }
  #intro img { margin-top: 70px; width: 560px; }

  /* ---------- phone ---------- */
  #phoneWrap { position: absolute; left: 50%; top: 500px; width: 700px; height: 1440px; margin-left: -350px; transform-origin: 50% 0; }
  #phone { position: absolute; inset: 0; border-radius: 88px; background: #111; padding: 20px; box-shadow: 0 40px 120px rgba(0,0,0,.35); }
  #screen { position: relative; width: 100%; height: 100%; border-radius: 70px; overflow: hidden; background: var(--bg); }
  .notch { position: absolute; top: 18px; left: 50%; width: 180px; height: 48px; margin-left: -90px; background: #111; border-radius: 30px; z-index: 30; }
  .status { height: 86px; background: #fff; }
  .appbar { height: 100px; background: #fff; display: flex; align-items: center; justify-content: center; }
  .appbar img { height: 42px; }
  .chips { background: #fff; padding: 6px 22px 16px; display: flex; gap: 10px; white-space: nowrap; }
  .chip { padding: 12px 22px; border-radius: 40px; background: var(--bg); font: 500 26px Noto; color: var(--ink); }
  .chip.on { background: var(--pink); color: #fff; font-weight: 700; }
  .sort { background: #fff; padding: 0 28px 16px; font: 700 24px Noto; color: var(--ink); display: flex; gap: 24px; }
  .sort span + span { color: var(--sub); font-weight: 500; }
  #feed { position: absolute; left: 0; right: 0; top: 362px; bottom: 0; overflow: hidden; }
  #feedInner { padding: 20px 20px 0; }
  .card { background: #fff; border-radius: 28px; padding: 20px; display: flex; gap: 20px; margin-bottom: 16px; }
  .thumb { width: 138px; height: 138px; border-radius: 20px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; font: 900 28px SCD; gap: 6px; }
  .thumb svg { width: 36px; height: 36px; opacity: .8; }
  .meta { flex: 1; min-width: 0; }
  .top { display: flex; align-items: center; gap: 10px; font: 400 21px Noto; color: var(--sub); }
  .badge { background: var(--pink-soft); color: var(--pink); font: 700 21px Noto; padding: 3px 11px; border-radius: 9px; }
  .title { font: 700 27px Noto; color: var(--ink); margin: 10px 0 8px; line-height: 1.3; }
  .priceRow { display: flex; align-items: baseline; gap: 10px; }
  .price { font: 900 36px Noto; color: var(--pink); }
  .ship { font: 400 21px Noto; color: var(--sub); }
  .stat { margin-left: auto; font: 400 21px Noto; color: var(--sub); }
  .ring { position: absolute; border: 6px solid #ffd84d; border-radius: 16px; z-index: 20; pointer-events: none; }

  #alertScreen { position: absolute; inset: 0; background: var(--bg); z-index: 10; }
  #alertScreen .head { height: 186px; background: #fff; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 28px; font: 700 32px Noto; color: var(--ink); }
  #alertScreen .tabs2 { background: #fff; display: flex; font: 700 26px Noto; border-bottom: 2px solid #eee; }
  #alertScreen .tabs2 div { flex: 1; text-align: center; padding: 20px 0; color: var(--sub); }
  #alertScreen .tabs2 .on { color: var(--pink); border-bottom: 6px solid var(--pink); }
  .rule { margin: 24px 20px 0; background: #fff; border-radius: 26px; padding: 28px 30px; display: flex; align-items: center; }
  .rule b { display: block; font: 700 34px Noto; color: var(--ink); }
  .rule small { display: block; margin-top: 8px; font: 400 24px Noto; color: var(--sub); }
  .switch { margin-left: auto; width: 92px; height: 54px; border-radius: 30px; background: var(--pink); position: relative; }
  .switch::after { content: ''; position: absolute; right: 7px; top: 7px; width: 40px; height: 40px; border-radius: 50%; background: #fff; }
  #push { position: absolute; left: 24px; right: 24px; top: 0; z-index: 40; background: rgba(255,255,255,.97); border-radius: 32px; padding: 24px 26px;
          box-shadow: 0 24px 60px rgba(0,0,0,.25); display: flex; gap: 20px; align-items: center; }
  #push .ic { width: 72px; height: 72px; border-radius: 18px; background: var(--pink); flex: none; display: flex; align-items: center; justify-content: center; }
  #push .ic svg { width: 42px; height: 42px; }
  #push .app { font: 500 21px Noto; color: var(--sub); }
  #push .t { font: 700 27px Noto; color: var(--ink); margin-top: 4px; }
  #push .b { font: 400 23px Noto; color: #444; margin-top: 4px; }
  .navbar { position: absolute; left: 0; right: 0; bottom: 0; height: 124px; background: #fff; display: flex; justify-content: space-around; align-items: center; font: 700 23px Noto; color: var(--sub); z-index: 5; }
  .navbar .on { color: var(--pink); }

  /* ---------- downside ---------- */
  #con { background: #141416; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #con .lbl { font: 700 48px SCD; color: #ffd84d; }
  #con .big { margin-top: 28px; font: 900 112px SCD; letter-spacing: -4px; line-height: 1.2; }
  #con .small { margin-top: 30px; font: 500 46px SCD; color: rgba(255,255,255,.7); }

  /* ---------- end card ---------- */
  #end { color: #fff; display: flex; flex-direction: column; align-items: center; }
  #end .logo { margin-top: 380px; width: 680px; }
  #end .tag { margin-top: 32px; font: 500 46px SCD; }
  #search { margin-top: 110px; width: 760px; height: 140px; border-radius: 80px; background: #fff; display: flex; align-items: center; padding: 0 50px; gap: 28px; box-shadow: 0 30px 80px rgba(0,0,0,.22); }
  #search svg { width: 60px; height: 60px; flex: none; }
  #query { font: 700 60px Noto; color: var(--ink); }
  #caret { width: 5px; height: 64px; background: var(--pink); display: inline-block; margin-left: 6px; }
  #end .cta { margin-top: 70px; font: 900 92px SCD; letter-spacing: -2px; text-align: center; line-height: 1.3; }
  #end .cta .store { font-size: 56px; font-weight: 700; display: block; }
</style>
</head>
<body>
<div id="stage">
  <div id="adTag">광고 · 오픈런 제작</div>

  <div class="layer" id="intro">
    <div class="maker" id="maker">만든 사람이 직접 하는</div>
    <div class="big" id="introBig">오픈런<br><em>솔직 리뷰</em></div>
    <img id="introLogo" src="../assets/images/common/ci_run_white.png" alt="">
  </div>

  <div class="layer" id="phoneScene">
    <div id="header"><div class="t">오픈런 <span>장점 3가지</span></div>
      <div id="steps"><span class="step" id="st1">① 모아보기</span><span class="step" id="st2">② 한눈에</span><span class="step" id="st3">③ 알림</span></div>
    </div>
    <div id="phoneWrap"><div id="phone"><div id="screen">
      <div class="notch"></div>
      <div id="push">
        <div class="ic"><svg viewBox="0 0 24 24"><path fill="#fff" d="M13.5 1.7s.7 2.6.7 4.7c0 2-1.3 3.6-3.3 3.6S7.5 8.4 7.5 6.4l.03-.36C5.6 8.3 4.5 11.2 4.5 14.3c0 4.1 3.4 7.5 7.5 7.5s7.5-3.4 7.5-7.5c0-5.1-2.4-9.6-6-12.6zM11.8 19c-1.6 0-2.9-1.3-2.9-2.9 0-1.5 1-2.6 2.6-2.9 1.6-.3 3.3-1.1 4.2-2.4.4 1.2.6 2.5.6 3.8 0 2.4-2 4.4-4.5 4.4z"/></svg></div>
        <div><div class="app">오픈런 · 방금</div><div class="t">'제로콜라' 핫딜 · 18,900원</div><div class="b">[쿠팡] 제로 콜라 355ml 24캔 · 무료배송</div></div>
      </div>
      <div class="status"></div>
      <div class="appbar"><img src="../assets/images/splash/openrun_logo.png" alt=""></div>
      <div class="chips"><span class="chip on">전체</span><span class="chip">디지털·가전</span><span class="chip">식품</span><span class="chip">생활</span></div>
      <div class="sort"><span>최신순</span><span>인기순</span></div>
      <div id="feed"><div id="feedInner"></div></div>
      <div class="ring" id="ringPrice"></div>
      <div id="alertScreen">
        <div class="head">알림</div>
        <div class="tabs2"><div class="on">알림 조건</div><div>받은 알림</div></div>
        <div class="rule" id="rule0"><div><b>제로콜라</b><small>20,000원 이하 · 무료배송</small></div><div class="switch"></div></div>
        <div class="rule"><div><b>무선 이어폰</b><small>10만원 이하 · 리퍼 제외</small></div><div class="switch"></div></div>
        <div class="rule"><div><b>생수</b><small>식품 · 쿠팡, G마켓</small></div><div class="switch"></div></div>
      </div>
      <div class="navbar"><span id="navDeal" class="on">핫딜</span><span id="navAlert">알림</span><span>설정</span></div>
    </div></div></div>
  </div>

  <div class="layer" id="con">
    <div class="lbl" id="conLbl">솔직히 아쉬운 점</div>
    <div class="big" id="conBig">아직<br>Android만 돼요</div>
    <div class="small" id="conSmall">iOS 버전은 준비 중</div>
  </div>

  <div class="layer" id="end">
    <img class="logo" id="endLogo" src="../assets/images/common/ci_run_white.png" alt="">
    <div class="tag" id="endTag">커뮤니티 핫딜, 가장 빠르게</div>
    <div id="search">
      <svg viewBox="0 0 24 24"><path fill="#8a8a8e" d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <span id="query"></span><span id="caret"></span>
    </div>
    <div class="cta" id="endCta"><span class="store">구글 플레이스토어에서</span>'오픈런' 검색!</div>
  </div>

  <div id="sub"></div>
</div>

<!-- Scene and subtitle timing, generated from the narration lengths by make_timing.py -->
<script src="timing.js"></script>
<script>
const ICON = {
  food: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M11 9H9V2H7v7H5V2H3v7c0 2.1 1.7 3.8 3.8 4V22h2.4v-9c2.1-.2 3.8-1.9 3.8-4V2h-2v7zm5-3v8h2.5v8H21V2c-2.8 0-5 2.2-5 4z"/></svg>',
  digital: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M12 3a9 9 0 0 0-9 9v7c0 1.1.9 2 2 2h3v-8H5v-1a7 7 0 0 1 14 0v1h-3v8h3c1.1 0 2-.9 2-2v-7a9 9 0 0 0-9-9z"/></svg>',
  living: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>',
  fashion: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M16 3l-4 3-4-3-6 4 2 5 2-1v10h12V11l2 1 2-5z"/></svg>',
};
const DEALS = [
  { shop: '쿠팡', color: '#E5483B', cat: 'food', src: '커뮤니티 A 외 2곳', ago: '방금', title: '제로 콜라 355ml 24캔', price: '18,900원', ship: '무료배송', stat: '추천 12' },
  { shop: 'G마켓', color: '#2DB400', cat: 'digital', src: '커뮤니티 B', ago: '3분 전', title: '노이즈캔슬링 무선 이어폰', price: '49,800원', ship: '무료배송', stat: '댓글 31' },
  { shop: '11번가', color: '#FF3B4E', cat: 'food', src: '커뮤니티 C', ago: '7분 전', title: '제주 감귤 5kg 로열과', price: '12,900원', ship: '무료배송', stat: '추천 8' },
  { shop: '네이버', color: '#03C75A', cat: 'living', src: '커뮤니티 A', ago: '12분 전', title: '대용량 핫팩 150g 30개', price: '11,900원', ship: '무료배송', stat: '댓글 17' },
  { shop: '옥션', color: '#E4002B', cat: 'fashion', src: '커뮤니티 D', ago: '18분 전', title: '경량 구스 패딩 점퍼', price: '39,900원', ship: '무료배송', stat: '추천 21' },
  { shop: '쿠팡', color: '#E5483B', cat: 'food', src: '커뮤니티 B 외 1곳', ago: '25분 전', title: '생수 2L 24병', price: '9,900원', ship: '무료배송', stat: '추천 5' },
];
document.getElementById('feedInner').innerHTML = DEALS.map((d, i) => `
  <div class="card" id="card${i}">
    <div class="thumb" style="background:${d.color}">${ICON[d.cat]}<span>${d.shop}</span></div>
    <div class="meta">
      <div class="top"><span class="badge">${d.shop}</span><span>${d.src} · ${d.ago}</span></div>
      <div class="title">${d.title}</div>
      <div class="priceRow"><span class="price" id="price${i}">${d.price}</span><span class="ship">${d.ship}</span><span class="stat">${d.stat}</span></div>
    </div>
  </div>`).join('');

const $ = (id) => document.getElementById(id);
const clamp = (x) => Math.max(0, Math.min(1, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const outBack = (x) => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const inOut = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
function set(id, o) {
  const el = $(id);
  if ('op' in o) el.style.opacity = o.op;
  el.style.transform = `translate(${o.x || 0}px, ${o.y || 0}px) scale(${o.s ?? 1})`;
}
const sceneOp = (t, a, b, f = .25) => clamp(Math.min((t - a) / f, (b - t) / f));

// TIMING: { scenes: {intro:[a,b], p1:[a,b], p2:[a,b], p3:[a,b], con:[a,b], end:[a,b]}, subs: [{a,b,text}], duration }
const S = TIMING.scenes;
const DURATION = TIMING.duration;

function render(t) {
  // subtitles: the line being spoken, with **highlight** markup
  const sub = TIMING.subs.find((s) => t >= s.a && t < s.b);
  $('sub').innerHTML = sub ? `<span>${sub.text.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')}</span>` : '';
  if (sub) { const p = outCubic(prog(t, sub.a, sub.a + .2)); set('sub', { op: p, y: (1 - p) * 16 }); }

  // intro
  $('intro').style.opacity = sceneOp(t, -1, S.intro[1], .3);
  const m = outBack(prog(t, .1, .5)); set('maker', { op: clamp(m * 1.5), y: (1 - m) * 40 });
  const b = outBack(prog(t, .35, .85)); set('introBig', { op: clamp(b * 1.5), s: .8 + .2 * b });
  const l = outCubic(prog(t, .9, 1.4)); set('introLogo', { op: l, y: (1 - l) * 40 });

  // phone scenes p1..p3
  const ph0 = S.p1[0], ph1 = S.p3[1];
  $('phoneScene').style.opacity = sceneOp(t, ph0, ph1, .3);
  const rise = outCubic(prog(t, ph0, ph0 + .7));
  const zIn = inOut(prog(t, S.p2[0], S.p2[0] + .6)), zOut = inOut(prog(t, S.p3[0] - .1, S.p3[0] + .4));
  const z = zIn * (1 - zOut);
  set('phoneWrap', { y: (1 - rise) * 1400 + z * 80, s: 1 + z * .3 });
  ['st1', 'st2', 'st3'].forEach((id, i) => { $(id).className = 'step' + (t >= [S.p1, S.p2, S.p3][i][0] ? ' on' : ''); });

  const scroll = inOut(prog(t, ph0 + 1.4, S.p1[1] - .9)) * 480 * (1 - inOut(prog(t, S.p1[1] - .7, S.p1[1] - .1)));
  $('feedInner').style.transform = `translateY(${-scroll}px)`;
  DEALS.forEach((_, i) => {
    const p = outCubic(prog(t, ph0 + .3 + i * .08, ph0 + .8 + i * .08));
    set(`card${i}`, { op: p * (i === 0 ? 1 : 1 - .55 * z), y: (1 - p) * 50 });
  });
  // yellow ring around price + shop of the first card during point 2
  const ring = $('ringPrice'), rp = outBack(prog(t, S.p2[0] + .9, S.p2[0] + 1.3)) * (1 - prog(t, S.p3[0] - .2, S.p3[0]));
  const card = $('card0');
  ring.style.left = (card.offsetLeft + 14) + 'px'; ring.style.top = (card.offsetTop + 362 + 14) + 'px';
  ring.style.width = (card.offsetWidth - 28) + 'px'; ring.style.height = (card.offsetHeight - 28) + 'px';
  ring.style.opacity = clamp(rp); ring.style.transform = `scale(${1.08 - .08 * clamp(rp)})`;

  const alertIn = inOut(prog(t, S.p3[0], S.p3[0] + .6));
  $('alertScreen').style.transform = `translateX(${(1 - alertIn) * 100}%)`;
  $('navDeal').className = alertIn > .5 ? '' : 'on';
  $('navAlert').className = alertIn > .5 ? 'on' : '';
  const pushAt = S.p3[0] + (S.p3[1] - S.p3[0]) * .55;
  const drop = outBack(prog(t, pushAt, pushAt + .5)), lift = inOut(prog(t, S.p3[1] - .4, S.p3[1]));
  set('push', { op: prog(t, pushAt - .05, pushAt + .1), y: -220 + drop * 240 - lift * 260, s: .96 + .04 * drop });

  // downside
  $('con').style.opacity = sceneOp(t, S.con[0], S.con[1], .25);
  const c1 = outCubic(prog(t, S.con[0] + .1, S.con[0] + .4)); set('conLbl', { op: c1, y: (1 - c1) * 30 });
  const c2 = outBack(prog(t, S.con[0] + .3, S.con[0] + .7)); set('conBig', { op: clamp(c2 * 1.4), s: .85 + .15 * c2 });
  const c3 = outCubic(prog(t, S.con[0] + .9, S.con[0] + 1.3)); set('conSmall', { op: c3 });

  // end card
  const e0 = S.end[0];
  $('end').style.opacity = sceneOp(t, e0, 999, .25);
  const lp = outBack(prog(t, e0 + .1, e0 + .6)); set('endLogo', { op: clamp(lp * 1.4), s: .7 + .3 * lp });
  const tg = outCubic(prog(t, e0 + .5, e0 + .9)); set('endTag', { op: tg, y: (1 - tg) * 30 });
  const sp = outCubic(prog(t, e0 + .8, e0 + 1.2)); set('search', { op: sp, y: (1 - sp) * 60 });
  const word = '오픈런', n = Math.floor(prog(t, e0 + 1.3, e0 + 2.1) * (word.length + .999));
  $('query').textContent = word.slice(0, n);
  $('caret').style.opacity = Math.floor(t * 2.5) % 2 === 0 ? 1 : 0;
  const cp = outBack(prog(t, e0 + 2.2, e0 + 2.7)); set('endCta', { op: clamp(cp * 1.5), s: .85 + .15 * cp });
}
window.render = render;
window.DURATION = DURATION;
render(Number(new URLSearchParams(location.search).get('t') || 0));
</script>
